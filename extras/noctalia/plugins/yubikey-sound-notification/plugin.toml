id           = "introdus/yubikey-sound-notification"
name         = "Yubikey Sound Notification"
version      = "1.0.0"
plugin_api   = 14
author       = "fidgetingbits"
license      = "MIT"
icon         = "key"
description  = "Control the volume of yubikey sound notifications"
dependencies = ["yubikey-play-sound"]
tags         = ["yuibkey", "notification"]

[[widget]]
id    = "yubikey-sound"
entry = "widget.luau"

    [[widget.setting]]
    key = "icon_click"
    type = "select"
    label_key = "yubikey.settings.icon_click.label"
    description_key = "yubikey.settings.icon_click.description"
    default = "mute"
    options = [
      { value = "mute", label_key = "yubikey.settings.icon_click.options.mute" },
      { value = "panel", label_key = "yubikey.settings.icon_click.options.panel" },
    ]

    [[widget.setting]]
    key = "scroll_step"
    type = "int"
    label_key = "yubikey.settings.scroll_step.label"
    description_key = "yubikey.settings.scroll_step.description"
    default = 2
    min = 1
    max = 25
    step = 1

    [[widget.setting]]
    key = "drag_enabled"
    type = "bool"
    label_key = "yubikey.settings.drag_enabled.label"
    description_key = "yubikey.settings.drag_enabled.description"
    default = true

    [[widget.setting]]
    key = "slider_width"
    type = "int"
    label_key = "yubikey.settings.slider_width.label"
    description_key = "yubikey.settings.slider_width.description"
    default = 100
    min = 40
    max = 300
    step = 2

    [[widget.setting]]
    key = "slider_thickness"
    type = "int"
    label_key = "yubikey.settings.slider_thickness.label"
    description_key = "yubikey.settings.slider_thickness.description"
    default = 7
    min = 4
    max = 24
    step = 1

    [[widget.setting]]
    key = "bar_color"
    type = "select"
    label_key = "yubikey.settings.bar_color.label"
    description_key = "yubikey.settings.bar_color.description"
    default = "primary"
    options = [
      { value = "primary", label_key = "yubikey.settings.bar_color.options.primary" },
      { value = "onsurface", label_key = "yubikey.settings.bar_color.options.onsurface" },
      { value = "secondary", label_key = "yubikey.settings.bar_color.options.secondary" },
      { value = "tertiary", label_key = "yubikey.settings.bar_color.options.tertiary" },
      { value = "hover", label_key = "yubikey.settings.bar_color.options.hover" },
      { value = "error", label_key = "yubikey.settings.bar_color.options.error" },
    ]

    [[widget.setting]]
    key = "point_style"
    type = "select"
    label_key = "yubikey.settings.point_style.label"
    description_key = "yubikey.settings.point_style.description"
    default = "flat"
    options = [
      { value = "rounded", label_key = "yubikey.settings.point_style.options.rounded" },
      { value = "flat", label_key = "yubikey.settings.point_style.options.flat" },
    ]

    [[widget.setting]]
    key = "show_knob"
    type = "bool"
    label_key = "yubikey.settings.show_knob.label"
    description_key = "yubikey.settings.show_knob.description"
    default = false

    [[widget.setting]]
    key = "knob_color"
    visible_when = { key = "show_knob", values = ["true"] }
    type = "select"
    label_key = "yubikey.settings.knob_color.label"
    description_key = "yubikey.settings.knob_color.description"
    default = "primary"
    options = [
      { value = "on_primary", label_key = "yubikey.settings.knob_color.options.on_primary" },
      { value = "on_surface", label_key = "yubikey.settings.knob_color.options.on_surface" },
      { value = "primary", label_key = "yubikey.settings.knob_color.options.primary" },
      { value = "secondary", label_key = "yubikey.settings.knob_color.options.secondary" },
      { value = "tertiary", label_key = "yubikey.settings.knob_color.options.tertiary" },
      { value = "error", label_key = "yubikey.settings.knob_color.options.error" },
    ]
